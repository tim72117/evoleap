      <rect x="110" y="190" width="22" height="60" rx="3" fill="#7fa7d9"/>
      <rect x="136" y="200" width="18" height="50" rx="3" fill="#f2b880"/>
      <rect x="158" y="184" width="24" height="66" rx="3" fill="#9fc9b4"/>
