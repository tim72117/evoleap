      <path d="M812 630 L828 640" stroke="#a3adbb" stroke-width="22" stroke-linecap="round"/>
      <ellipse cx="832" cy="642" rx="28" ry="12" fill="#d3d9e2" stroke="#a3adbb" stroke-width="2"/>
      <path d="M842 648 L856 656 M830 650 L840 658 M818 650 L826 657" stroke="#a3adbb" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="hand">
