      <path d="M716 624 Q726 636 742 632" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M752 646 L766 655 M740 649 L750 658 M727 650 L734 659 M713 646 L716 655" stroke="#aeb7c5" stroke-width="6.5" stroke-linecap="round"/>
    </g>
  </g>

  <g id="hologram">
    <path id="beam" d="M960 652 L770 572 L1190 590 Z" fill="url(#g-beam)"/>
    <g id="mini-panel" filter="url(#f-glow)">
      <path d="M1220 250 L1400 240 L1400 380 L1220 384 Z" fill="url(#g-holo)" stroke="#8ff0ff" stroke-width="2"/>
      <g fill="#2fb6e8" opacity="0.85">
        <rect x="1244" y="330" width="18" height="34"/>
        <rect x="1274" y="310" width="18" height="54"/>
        <rect x="1304" y="290" width="18" height="74"/>
        <rect x="1334" y="300" width="18" height="64"/>
        <rect x="1364" y="270" width="18" height="94"/>
      </g>
      <path d="M1244 320 L1283 298 L1313 280 L1343 288 L1373 258" stroke="#ff7bd5" stroke-width="3" fill="none"/>
    </g>
    <g id="scanlines" stroke="#ffffff" stroke-width="1" opacity="0.18">
