    <pattern id="p-keys" x="0" y="0" width="17" height="7.5" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="14" height="5" rx="1.5" fill="#7fe8ff" opacity="0.55"/>
    </pattern>
    <filter id="f-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="f-blur-sm" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#33415c" flood-opacity="0.2"/></filter>
