    <linearGradient id="g-holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2a6dff" stop-opacity="0.16"/>
