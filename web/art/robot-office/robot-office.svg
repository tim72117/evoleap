    <linearGradient id="g-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6fe6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fe6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-chair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c323d"/>
      <stop offset="1" stop-color="#454d5c"/>
    </linearGradient>
    <linearGradient id="g-pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e3da"/>
      <stop offset="1" stop-color="#c9c0b3"/>
