      <ellipse cx="330" cy="128" rx="26" ry="5" fill="#fff4cf" filter="url(#f-glow)"/>
      <line x1="640" y1="0" x2="640" y2="70" stroke="#b5bdc9" stroke-width="2"/>
      <path d="M606 96 Q606 70 640 70 Q674 70 674 96 Z" fill="#ffffff" stroke="#d9dee6" stroke-width="2"/>
      <ellipse cx="640" cy="98" rx="22" ry="4" fill="#fff4cf" filter="url(#f-glow)"/>
