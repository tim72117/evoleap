        <path d="M160 760 Q90 650 70 560 Q130 620 165 750 Z"/>
        <path d="M160 760 Q150 620 190 520 Q205 640 170 760 Z" fill="#5fb07c"/>
        <path d="M165 760 Q230 650 270 600 Q250 700 175 765 Z"/>
        <path d="M155 765 Q80 720 40 690 Q120 700 160 760 Z" fill="#3f855a"/>
        <path d="M168 760 Q240 730 285 720 Q235 760 172 770 Z" fill="#3f855a"/>
      </g>
      <path d="M100 760 L220 760 L205 900 L115 900 Z" fill="url(#g-pot)"/>
    </g>
