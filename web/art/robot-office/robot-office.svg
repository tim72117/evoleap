  <g id="robot">
    <g id="arm-back">
      <path d="M498 410 L556 520 L812 630" stroke="#a3adbb" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M556 516 L810 624" stroke="#d5dbe4" stroke-width="20" stroke-linecap="round" fill="none"/>

    </g>
    <g id="torso">
      <path d="M425 395 Q425 360 465 356 L540 356 Q580 362 580 402 L568 560 Q562 594 522 596 L462 596 Q430 592 430 560 Z" fill="url(#g-shell)"/>
      <path d="M432 400 Q430 380 450 370 L450 590 Q432 584 432 560 Z" fill="#c7cfda" opacity="0.7"/>
