    <radialGradient id="g-sun" cx="0.72" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#fff9e2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff9e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-ear" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="1" stop-color="#22b8e8"/>
