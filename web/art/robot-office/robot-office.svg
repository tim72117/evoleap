      <path d="M512 236 Q560 232 582 252" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.28"/>
      <path id="head-shade" d="M410 300 Q440 340 500 342 L540 342 Q470 336 430 300 Z" fill="#9aa6b6" opacity="0.35"/>
      <path id="holo-rim" d="M592 250 Q604 290 590 322" stroke="#7fefff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" filter="url(#f-blur-sm)"/>
