<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="g-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e4e9f1"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d4ff"/>
      <stop offset="0.7" stop-color="#e3f1ff"/>
      <stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde3eb"/>
      <stop offset="1" stop-color="#c6cdd8"/>
    </linearGradient>
    <linearGradient id="g-desk-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="g-desk-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4ea"/>
      <stop offset="1" stop-color="#c3cad5"/>
    </linearGradient>
    <linearGradient id="g-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f0f3f7"/>
      <stop offset="1" stop-color="#c4ccd8"/>
    </linearGradient>
    <linearGradient id="g-shell-side" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#b9c2cf"/>
    </linearGradient>
    <linearGradient id="g-visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36425a"/>
      <stop offset="0.5" stop-color="#151c2b"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="g-joint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab4c2"/>
      <stop offset="1" stop-color="#6c7789"/>
