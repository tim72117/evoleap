      <path d="M770 290 L1190 256" stroke="#8ff0ff" stroke-width="1.5" opacity="0.6"/>
      <g id="dots" fill="#8ff0ff"><circle cx="790" cy="270" r="4"/><circle cx="804" cy="269" r="4"/><circle cx="818" cy="268" r="4"/></g>
    </g>
    <g id="code" transform="matrix(1 -0.088 0 1 0 0)" font-family="Consolas, 'Cascadia Mono', monospace" font-size="21" font-weight="600">
      <text x="796" y="400"><tspan fill="#ff7bd5">function</tspan><tspan fill="#0a5f86"> build</tspan><tspan fill="#0f3b57">(task) {</tspan></text>
      <text x="820" y="436"><tspan fill="#ff7bd5">const</tspan><tspan fill="#0f3b57"> plan = </tspan><tspan fill="#0a5f86">think</tspan><tspan fill="#0f3b57">(task)</tspan></text>
      <text x="820" y="472"><tspan fill="#ff7bd5">for</tspan><tspan fill="#0f3b57"> (</tspan><tspan fill="#ff7bd5">const</tspan><tspan fill="#0f3b57"> step </tspan><tspan fill="#ff7bd5">of</tspan><tspan fill="#0f3b57"> plan) {</tspan></text>
      <text x="844" y="508"><tspan fill="#ff7bd5">await</tspan><tspan fill="#0a5f86"> write</tspan><tspan fill="#0f3b57">(step)</tspan></text>
      <text x="820" y="544" fill="#0f3b57">}</text>
      <text x="820" y="580"><tspan fill="#ff7bd5">return</tspan><tspan fill="#0a5f86"> ship</tspan><tspan fill="#0f3b57">()</tspan></text>
      <text x="796" y="616" fill="#0f3b57">}</text>
      <rect id="caret" x="976" y="563" width="11" height="22" fill="#0a5f86"/>
    </g>
    <ellipse id="emitter-base" cx="960" cy="660" rx="54" ry="10" fill="#c9d1dc"/>
    <ellipse id="emitter" cx="960" cy="654" rx="42" ry="7" fill="#5fe3ff" filter="url(#f-glow)"/>
    <ellipse id="holo-reflect" cx="980" cy="680" rx="200" ry="10" fill="#7fefff" opacity="0.25" filter="url(#f-blur-sm)"/>
  </g>
</svg>
