<!doctype html>
<!-- 預設分享圖 public/og-default.png(1200×630)的原始檔。修改後重新產生:
     msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-default.png scripts/og-image.html
     (Chrome 參數相同) -->
<html lang="zh-Hant">
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
    background: radial-gradient(circle at 85% 15%, #e6efd6 0, transparent 45%), #f7f6f1;
    color: #151713;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 28px; font-size: 30px; font-weight: 700; color: #5c6057; }
  .brand img { height: 72px; }
  .brand span { padding-left: 28px; border-left: 2px solid #e3e2da; }
  h1 { margin: 48px 0 24px; font-size: 80px; line-height: 1.1; letter-spacing: 2px; }
  p { margin: 0; font-size: 40px; color: #447a14; font-weight: 700; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, #4a8217, #7ab929 70%, #9a6238); }
</style>
<body>
  <div class="brand"><img src="../public/brand/evoleap-logo.svg" alt="evoleap" /><span>evoleap.io</span></div>
  <h1>從零開始的 AI 課程地圖</h1>
  <p>不會寫程式，也能打造自己的軟體</p>
  <div class="bar"></div>
</body>
</html>
