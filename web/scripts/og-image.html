<!doctype html>
<!-- 預設分享圖 public/og-default.png(1200×630)的原始檔。修改後重新產生:
     msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-default.png scripts/og-image.html
     (Chrome 參數相同) -->
<html lang="zh-Hant">
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
    background: radial-gradient(circle at 85% 15%, #e3e0ff 0, transparent 45%), #f7f8ff;
    color: #1b1d3a;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 30px; font-weight: 700; color: #5b5f80; }
  .mark {
    width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6); color: #fff; font-size: 28px; font-weight: 800;
  }
  h1 { margin: 48px 0 20px; font-size: 92px; line-height: 1.1; letter-spacing: 2px; }
  p { margin: 0; font-size: 40px; color: #5b3fd6; font-weight: 700; }
  .domain { position: absolute; left: 96px; bottom: 56px; font-size: 26px; color: #5b5f80; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, #4f7cff, #8b5cf6); }
</style>
<body>
  <div class="brand"><span class="mark">VC</span>evoleap.io</div>
  <h1>Vibe Coding 實戰</h1>
  <p>從零開始的 AI 課程地圖</p>
  <div class="domain">不會寫程式，也能打造自己的軟體</div>
  <div class="bar"></div>
</body>
</html>
