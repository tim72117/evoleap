<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>小森咖啡</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="x" data-x="main" data-kind="box" data-tag="&lt;main&gt;">
    <div class="x" data-x="title" data-kind="text" data-tag="&lt;h1&gt;"><h1>小森咖啡</h1></div>
    <div class="card x" data-x="card" data-kind="box" data-tag="&lt;div&gt;">
      <div class="x" data-x="photo" data-kind="media" data-tag="&lt;img&gt;"><img id="photo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'%3E%3Crect width='320' height='180' rx='16' fill='%23e8d3b0'/%3E%3Ctext x='160' y='122' font-size='96' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E" alt="一杯手沖咖啡"></div>
      <div class="x" data-x="intro" data-kind="text" data-tag="&lt;p&gt;"><p id="intro">衣索比亞淺焙，帶一點花香與柑橘的酸。</p></div>
      <div class="x" data-x="price" data-kind="text" data-tag="&lt;p&gt;"><p id="price">NT$ 150</p></div>
      <div class="x" data-x="add" data-kind="action" data-tag="&lt;button&gt;"><button id="add">加入購物車</button></div>
    </div>
  </main>
  <!-- 示範用的開關(畫面上看不到):點了把對應的元素藏起來,再點一次恢復(互動腳本從結構圖點節點時用) -->
  <div hidden>
    <button data-hide="main"></button><button data-hide="title"></button><button data-hide="card"></button>
    <button data-hide="photo"></button><button data-hide="intro"></button><button data-hide="price"></button><button data-hide="add"></button>
  </div>
  <script src="script.js"></script>
</body>
</html>
