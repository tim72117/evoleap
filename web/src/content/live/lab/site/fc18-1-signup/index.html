<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>雲端主控台 · 註冊</title></head><body>
<div id="app">
<header class="ctop"><span class="logo">☁ 雲端主控台</span><span class="proj">尚未選擇專案</span><span class="me">你</span></header>
<main class="wrap">
<section data-only="0" class="welcome"><h1>歡迎使用 Google Cloud</h1><p class="lead">已用 you@gmail.com 登入。開始之前，需要建立帳單帳戶。</p><button id="start" class="primary" data-go="1">開始免費試用</button></section>
<section data-only="1"><p class="kicker">第 1 步，共 2 步</p><h1>帳戶資訊</h1>
<div class="box"><label class="row">國家／地區 <select><option>台灣</option></select></label>
<label class="row you"><input type="checkbox" id="agree"> 我已閱讀並同意服務條款<span class="tag">你自己勾</span></label>
<button id="next1" class="primary" data-go="2">繼續</button></div></section>
<section data-only="2"><p class="kicker">第 2 步，共 2 步</p><h1>付款資訊</h1>
<div class="box you"><b>帳戶類型：個人</b><span class="tag">由你自己填寫</span>
<div class="blur">信用卡號 ▢▢▢▢ ▢▢▢▢ ▢▢▢▢ ▢▢▢▢　到期 ▢▢/▢▢　安全碼 ▢▢▢<br>帳單地址 ▢▢▢▢▢▢▢▢▢▢▢▢</div></div>
<p class="note">綁卡是為了確認身分。試用期間不會自動扣款；要升級成付費帳戶，需要你另外手動確認。</p>
<button id="next2" class="primary" data-go="3">開始免費試用</button></section>
<section data-only="3"><div class="box ok"><h1>✓ 試用已開始</h1>
<p>已建立帳單帳戶：<b>我的帳單帳戶</b>　<span class="mono">0X1A2B-3C4D5E-6F7A8B</span></p>
<p>試用金與期限顯示在「帳單」頁。</p></div></section>
</main></div></body></html>
