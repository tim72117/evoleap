<!doctype html><html><head><title>小森選物</title></head><body>
<div class="app">
  <header><b>小森選物</b><span class="cart">🛒 <em id="cart">0</em></span></header>
  <section class="shop" id="shop">
    <div class="item"><div class="img"><svg viewBox="0 0 100 70"><rect x="22" y="22" width="56" height="34" rx="10" fill="#fff9"/><circle cx="40" cy="20" r="6" fill="#fff7"/><circle cx="56" cy="14" r="4" fill="#fff7"/></svg></div>
      <h3>手工皂</h3><p>NT$ 280</p><button id="add">加入購物車</button></div>
    <a class="go" id="checkout" href="#pay">去結帳 →</a>
  </section>
  <section class="pay" id="paybox">
    <h3>結帳</h3><p>手工皂 × <span id="qty">0</span>　合計 NT$ <span id="sum">0</span></p>
    <label>Email<input id="email" type="email" placeholder="you@example.com"></label>
    <button id="pay">送出訂單</button>
  </section>
  <section class="done" id="done"><div class="big">✓</div><h3>訂單完成</h3><p>訂單編號 #A1024，確認信已寄到你的信箱。</p></section>
</div>
</body></html>
