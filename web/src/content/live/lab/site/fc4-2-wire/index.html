<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>草圖與流程</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-start="1">
<div class="tabs">
  <button class="tab cur" id="w1" data-go="1">完成稿</button>
  <button class="tab" id="w2" data-go="2">線框圖</button>
  <button class="tab" id="w3" data-go="3">使用流程</button>
</div>
<div class="p1">
  <div class="row">
    <div class="phone fin"><div class="hd">🥐 小森烘焙</div><div class="hero">今日現烤 · 早上 8 點出爐</div><div class="item"><span class="pic">🥐</span>可頌 <b>NT$ 55</b></div><div class="item"><span class="pic">🍞</span>吐司 <b>NT$ 80</b></div><div class="cta">開始預訂</div></div>
    <div class="note card">顏色、照片、字型、圓角……<br><b>做到這裡才發現流程不對，</b><br>前面花的時間就白費了。</div>
  </div>
</div>
<div class="p2">
  <div class="row">
    <div class="phone wf"><div class="bx h40">標題</div><div class="bx h80">╳ 大圖</div><div class="bx h50">品項　價格　［＋］</div><div class="bx h50">品項　價格　［＋］</div><div class="bx h50 dark">［ 開始預訂 ］</div></div>
    <div class="note card"><b>線框圖</b>：只用灰框框排位置<br>✓ 畫面上有哪些東西<br>✓ 放在哪裡<br>✗ 不管顏色、照片、字型<br><span class="muted">五分鐘就能重畫一張</span></div>
  </div>
</div>
<div class="p3">
  <div class="flow">
    <div class="sc">🏠 首頁</div><div class="ar">→</div><div class="sc">📋 選麵包</div><div class="ar">→</div><div class="sc">🕐 選取貨時間</div><div class="ar">→</div><div class="sc">✅ 完成<br><span class="muted">訂單編號</span></div>
  </div>
  <div class="note card wide">使用流程：客人<b>從哪裡進來、按了什麼、最後停在哪</b>。<br>每個箭頭都是一顆要按的按鈕；走不回去、走不下去的地方，就是要修的地方。</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
