<!doctype html><html><head><title>修正指令的三個材料</title></head><body>
<div class="wrap">
  <h1 class="ttl">把「怪怪的」改成 AI 修得動的話</h1>
  <p class="sub">點一張卡，看它怎麼改寫</p>
  <div class="rows">
    <div class="row" id="m1" data-go="m1"><div class="bad box">「怪怪的，再改一下」</div><div class="arr">→</div><div class="good box" data-at="m1"><span class="t one">一次一件</span>手機版商品卡的價格換行了，請只修這個</div></div>
    <div class="row" id="m2" data-go="m2"><div class="bad box">「按了沒反應」</div><div class="arr">→</div><div class="good box" data-at="m2"><span class="t ev">附上證據</span>按加入購物車後，畫面出現：<span class="mono">TypeError: cart.add is not a function（buy.js:14）</span></div></div>
    <div class="row" id="m3" data-go="m3"><div class="bad box">「排版不好看」</div><div class="arr">→</div><div class="good box" data-at="m3"><span class="t ex">說出期待</span>（附截圖）兩張卡片的按鈕高度不一樣，希望按鈕都貼齊卡片底部</div></div>
  </div>
  <div class="legend" data-at="m3"><span class="t one">一次一件</span><span class="t ev">證據：截圖、錯誤原文</span><span class="t ex">期待的結果</span></div>
</div>
</body></html>
