<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>草圖 · 小森預訂</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-start="1">
<div class="bar">線框草圖 v1 · 可以點</div>
<div class="scr s1"><div class="lbl">首頁</div><div class="bx">小森烘焙</div><div class="bx big">╳ 今日麵包照片</div><button class="wb" id="start" data-go="2">開始預訂</button></div>
<div class="scr s2"><div class="lbl">選麵包</div><div class="it">可頌　NT$55 <button class="sm" id="add" data-go="3">＋ 加入</button></div><div class="it">吐司　NT$80 <button class="sm">＋ 加入</button></div><div class="it">肉桂捲　NT$65 <button class="sm">＋ 加入</button></div></div>
<div class="scr s3"><div class="lbl">確認與取貨時間</div><div class="it">可頌 <span>× 1</span></div><div class="bx">取貨時間：［ 11/15 上午 ▾ ］</div><button class="wb" id="send" data-go="4">送出預訂</button></div>
<div class="scr s4"><div class="lbl">完成</div><div class="bx big">✓ 預訂成功<br>編號 A-1024</div></div>
</div>
<script src="script.js"></script>
</body>
</html>
