<!doctype html><html><head><title>用量都花去哪了</title></head><body>
<div class="wrap">
  <h1 class="ttl">AI 的用量，花在「讀」比「寫」多</h1>
  <p class="sub">AI 每回答一次，都要把對話和讀過的東西再看一遍；點一條看看</p>
  <div class="plans">
    <div class="plan" id="p1" data-go="p1"><b>訂閱方案</b><span>每月固定費用，有用量上限</span><em data-at="p1">用完了要等重置，或升級</em></div>
    <div class="plan" id="p2" data-go="p2"><b>用量計費</b><span>用多少付多少（API）</span><em data-at="p2">沒有上限，帳單會跟著長</em></div>
  </div>
  <div class="chart">
    <div class="bar" id="b1" data-go="b1"><span class="lb">讀很多檔案</span><span class="fill" style="width:88%"></span><em data-at="b1">「看看整個專案」：一次讀幾十個檔</em></div>
    <div class="bar" id="b2" data-go="b2"><span class="lb">對話拉很長</span><span class="fill" style="width:74%"></span><em data-at="b2">每一句都要重看前面全部</em></div>
    <div class="bar" id="b3" data-go="b3"><span class="lb">貼整份錯誤紀錄</span><span class="fill" style="width:56%"></span><em data-at="b3">幾千行 log，有用的只有幾行</em></div>
    <div class="bar" id="b4" data-go="b4"><span class="lb">同時開很多個 AI</span><span class="fill" style="width:48%"></span><em data-at="b4">每一個都各自讀一遍</em></div>
    <div class="bar small" id="b5" data-go="b5"><span class="lb">真的寫程式</span><span class="fill" style="width:14%"></span><em data-at="b5">其實只佔一小部分</em></div>
  </div>
</div>
</body></html>
