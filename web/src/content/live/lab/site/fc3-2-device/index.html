<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>裝置授權</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-start="1">
<div class="card box">
  <div class="logo">🐙</div>
  <div class="p1">
    <div class="ttl">裝置授權</div>
    <div class="sub">輸入終端機上顯示的代碼</div>
    <input id="code" class="mono code" placeholder="XXXX-XXXX" maxlength="9">
    <button class="btn wide" id="next" data-go="2">繼續</button>
  </div>
  <div class="p2">
    <div class="ttl">要授權 GitHub CLI 嗎？</div>
    <div class="perm">它將可以：<br>✓ 讀寫你的 repository<br>✓ 建立 Issues</div>
    <button class="btn wide" id="auth" data-go="3">授權（你自己按）</button>
  </div>
  <div class="p3"><div class="big">✓</div><div class="ttl">裝置已連上</div><div class="sub">可以回到終端機了</div></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
