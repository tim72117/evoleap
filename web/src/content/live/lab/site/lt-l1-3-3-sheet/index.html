<!DOCTYPE html>

    <div class="tools"><span class="cellref">A1</span><button class="tool main" id="paste">貼上</button><button class="tool">復原</button><button class="tool">篩選</button><span class="hint">從 AI 的回覆複製表格，選好 A1 再貼上</span></div>
