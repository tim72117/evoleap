<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>登入 · 授權</title></head><body>
<div id="app" class="auth">
<div class="card box">
<section data-only="0"><p class="kicker">帳號登入</p><h1>選擇帳號</h1><p class="lead">以繼續前往「Google Cloud SDK」</p>
<div class="acct" id="pick" data-go="1"><span class="av">你</span><div><b>你</b><small>you@gmail.com</small></div></div>
<div class="acct dim"><span class="av g">＋</span><div><b>使用其他帳號</b></div></div></section>
<section data-only="1"><p class="kicker">you@gmail.com</p><h1>Google Cloud SDK 想要存取你的帳號</h1>
<ul><li>查看及管理你的 Google Cloud 資料</li><li>查看及管理你的雲端專案</li></ul>
<p class="note">確認這是你自己在終端機執行 <span class="mono">gcloud auth login</span> 才按允許。這一步由你按，AI 不會替你按。</p>
<div class="btns"><button class="ghost">取消</button><button id="allow" class="primary" data-go="2">允許</button></div></section>
<section data-only="2" class="ok"><h1>✓ 你已完成 Google Cloud SDK 的驗證</h1><p>可以關閉這個分頁，回到終端機。</p></section>
</div></div></body></html>
