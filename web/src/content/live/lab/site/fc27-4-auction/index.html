<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>廣告怎麼被買</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" id="app">
 <div class="ttl">你在網站上看到的廣告，是一場一瞬間的拍賣</div>
 <div class="row">
  <div class="card col slot">
   <div class="lbl">有人正在滑手機：台中、28 歲、喜歡甜點</div>
   <div class="bid" data-k="1 2"><b>小森烘焙</b><span>出價 NT$8 · 相關度 高</span></div>
   <div class="bid"><b>連鎖蛋糕店</b><span>出價 NT$12 · 相關度 低</span></div>
   <div class="bid"><b>健身房</b><span>出價 NT$15 · 相關度 很低</span></div>
   <div class="win" data-s="2">🏆 小森烘焙得到這個版位：出價不是最高，但最對這個人的胃口</div>
  </div>
  <div class="card col fun" data-s="3">
   <div class="lbl">一天 NT$500 的預算，跑了 3 天</div>
   <div class="fl f1" data-k="3"><b>12,000</b> 次曝光</div>
   <div class="fl f2" data-k="4"><b>180</b> 次點擊 <span>每次點擊 NT$8.3</span></div>
   <div class="fl f3" data-k="5"><b>6</b> 筆預約 <span>每筆 NT$250</span></div>
   <div class="px" data-s="5">📍 「預約」要能被算到，網站上要裝轉換追蹤</div>
  </div>
 </div>
 <div class="stepbar"><button class="btn" id="next">下一步 ▶</button><span class="cap" data-t0="受眾：你要給誰看" data-t1="出價：你願意為一次點擊付多少" data-t2="平台看出價，也看廣告和這個人合不合" data-t3="預算：一天最多花多少，花完就停" data-t4="點擊花了多少錢" data-t5="轉換：真的做了你要的事，一筆要多少錢"></span></div>
</div>
<script src="script.js"></script>
</body>
</html>
