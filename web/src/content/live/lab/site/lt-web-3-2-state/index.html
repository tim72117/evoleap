<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>小森選物</title></head>
<body>
<div class="app" id="app">
  <div class="page" id="page">
    <header class="top" id="top">
      <button class="menu" id="menu" aria-label="選單"><i></i><i></i><i></i></button>
      <div class="brand" id="brand">小森選物</div>
      <div class="right"><button class="login" id="login">登入</button><span class="cart" id="cart">購物車 <b id="count">0</b></span></div>
      <nav class="drawer" id="drawer" hidden><a>新品</a><a>杯盤</a><a>布品</a><a>關於我們</a></nav>
    </header>
    <div class="product">
      <div class="pic"><span class="cup"></span></div>
      <div class="pinfo">
        <h1>手作陶杯</h1>
        <p class="desc">手拉坯，每一個釉色都略有不同。</p>
        <p class="price">NT$ 680</p>
        <button class="add" id="add">加入購物車</button>
      </div>
    </div>
  </div>
  <aside class="panel" id="panel">
    <div class="p-title">狀態 <small>幕後：網頁此刻記得的事</small></div>
    <div class="st" id="st-cart"><span class="box">cartCount</span><span class="lab">購物車數量</span><span class="eq">＝</span><b class="v" id="v-cart">0</b></div>
    <div class="st" id="st-login"><span class="box">isLoggedIn</span><span class="lab">是否登入</span><span class="eq">＝</span><b class="v" id="v-login">否</b></div>
    <div class="st" id="st-menu"><span class="box">isMenuOpen</span><span class="lab">選單是否展開</span><span class="eq">＝</span><b class="v" id="v-menu">否</b></div>
    <div class="arrow">狀態改變 ↓ 照著狀態重新畫</div>
    <div class="renders" id="renders">畫面已更新 <b id="v-renders">0</b> 次</div>
  </aside>
</div>
</body>
</html>
