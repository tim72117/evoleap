<title>30 秒的結構</title>

</head>
<body>

<div class="wrap row" id="app">
 <div class="phone"><div class="scr">
  <div class="fr f0"><div class="pic"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><rect width="100" height="100" fill="#f7e3c4"/><ellipse cx="50" cy="60" rx="34" ry="16" fill="#d4934f"/><ellipse cx="50" cy="55" rx="30" ry="12" fill="#e9b170"/></svg></div><div class="big">這個可頌<br>為什麼會「咔滋」響？</div></div>
  <div class="fr f1"><div class="pic"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><rect width="100" height="100" fill="#f7e3c4"/><ellipse cx="50" cy="60" rx="34" ry="16" fill="#d4934f"/><ellipse cx="50" cy="55" rx="30" ry="12" fill="#e9b170"/></svg></div><div class="big">這個可頌<br>為什麼會「咔滋」響？</div></div>
  <div class="fr f2"><div class="pic dark"></div><div class="mid">祕密 1<br>奶油要冰到 4 度</div></div>
  <div class="fr f3"><div class="pic dark"></div><div class="mid">祕密 2<br>摺 27 層</div></div>
  <div class="fr f4"><div class="pic"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><rect width="100" height="100" fill="#f7e3c4"/><ellipse cx="50" cy="60" rx="34" ry="16" fill="#d4934f"/><ellipse cx="50" cy="55" rx="30" ry="12" fill="#e9b170"/></svg></div><div class="mid">咔滋——</div></div>
  <div class="fr f5"><div class="pic"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><rect width="100" height="100" fill="#f7e3c4"/><ellipse cx="50" cy="60" rx="34" ry="16" fill="#d4934f"/><ellipse cx="50" cy="55" rx="30" ry="12" fill="#e9b170"/></svg></div><div class="mid">週六開賣<br>連結在個人頁</div></div>
  <div class="sub2">字幕一次一句，放在中間偏下</div>
 </div></div>
 <div class="col">
  <div class="ttl">30 秒，切成四段</div>
  <div class="tl">
   <div class="seg s1" data-k="1">0–3 秒<br><b>鉤子</b></div>
   <div class="seg s2" data-k="2 3">3–20 秒<br><b>內容</b></div>
   <div class="seg s3" data-k="4">20–27 秒<br><b>結果</b></div>
   <div class="seg s4" data-k="5">27–30 秒<br><b>下一步</b></div>
  </div>
  <div class="note card" data-t0="先看一支做好的，再拆開" data-t1="前 3 秒決定會不會被滑走：直接丟出問題或畫面" data-t2="每 2–3 秒換一個畫面，節奏不拖" data-t3="一段只講一件事，字幕一句一行" data-t4="給出結果：讓人看到、聽到" data-t5="最後一句：要觀眾做什麼">先看一支做好的，再拆開</div>
  <div class="stepbar"><button class="btn" id="next">下一格 ▶</button></div>
 </div>
