<!doctype html><html><head><title>從問題到漏斗</title></head><body>
<div class="pg" id="pg" data-s="0">
<div class="q" id="q"><span>要回答的問題</span><b>來看商品的人，卡在哪一步沒下單？</b></div>
<div class="hd"><span>步驟</span><span>要記的事件</span><span>人數（上週）</span><button id="next">下一步 ▶</button></div>
<div class="rows" id="rows">
<div class="r r1" id="r1"><span class="st">① 進站</span><code>page_view</code><div class="bar"><div style="width:100%">1,000</div></div></div>
<div class="r r2" id="r2"><span class="st">② 看商品</span><code>view_item</code><div class="bar"><div style="width:62%">620</div></div></div>
<div class="r r3" id="r3"><span class="st">③ 加入購物車</span><code>add_to_cart</code><div class="bar"><div style="width:18%">180</div></div><em class="drop" id="drop">▼ 71% 在這裡離開</em></div>
<div class="r r4" id="r4"><span class="st">④ 開始結帳</span><code>begin_checkout</code><div class="bar"><div style="width:9%">90</div></div></div>
<div class="r r5" id="r5"><span class="st">⑤ 完成訂單</span><code>purchase</code><div class="bar"><div style="width:5.4%">54</div></div></div>
</div>
<div class="no" id="no"><b>不用記的：</b>滑鼠移到哪、每一次捲動、在每個按鈕停留幾秒……回答不了這個問題，記了只是雜訊。</div>
</div></body></html>
