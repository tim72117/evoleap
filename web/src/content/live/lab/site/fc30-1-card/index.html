<!doctype html><html><head><title>任務說明的三格</title></head><body>
<div class="wrap">
  <h1 class="ttl">一張好的任務卡，有三格</h1>
  <p class="sub">任務：在首頁加上營業時間</p>
  <div class="card">
    <div class="slot" id="g" data-go="g"><div class="k blue">目標</div><div class="v"><span class="hint">要做什麼？</span><span data-at="g">在首頁「關於我們」下面，加一個營業時間的區塊（週二到週日 9:00–18:00，週一公休）</span></div></div>
    <div class="slot" id="c" data-go="c"><div class="k orange">限制</div><div class="v"><span class="hint">不能動什麼？</span><span data-at="c">只改 index.html 和 style.css；配色、字型、其他區塊都不要動</span></div></div>
    <div class="slot" id="d" data-go="d"><div class="k green">完成條件</div><div class="v"><span class="hint">怎樣算完成？</span><span data-at="d">手機寬度一行一天、不換行；npm test 通過；截圖給我看</span></div></div>
  </div>
  <div class="why">
    <div class="box" data-at="g"><b>少了目標</b>：AI 猜你要什麼</div>
    <div class="box" data-at="c"><b>少了限制</b>：AI 順手改一堆</div>
    <div class="box" data-at="d"><b>少了完成條件</b>：AI 不知道何時停</div>
  </div>
</div>
</body></html>
