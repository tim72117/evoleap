<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>曝光管道</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
 <div class="ttl">你的客人，會在哪裡找到你？</div>
 <div class="tabs"><span class="tb act" data-tab="shop" id="t-shop">有店面的小店</span><span class="tb" data-tab="online" id="t-online">線上的工具或服務</span></div>
 <div data-panel="shop" class="grid">
  <div class="ch card top" id="c-map"><b>地圖上的商家資訊</b><span>搜「附近 麵包」時出現</span><em>要：地址驗證（明信片或電話）、營業時間、照片</em></div>
  <div class="ch card" id="c-review"><b>美食評論網站</b><span>還在挑店的人會看</span><em>要：店家認領、照片、回覆評論</em></div>
  <div class="ch card" id="c-local"><b>地方社團、在地媒體</b><span>附近的人</span><em>要：遵守版規，不要硬推銷</em></div>
 </div>
 <div data-panel="online" class="grid gone">
  <div class="ch card top" id="c-launch"><b>新產品發表平台</b><span>喜歡嘗鮮的早期使用者</span><em>要：一句話介紹、截圖、上架當天在線回覆</em></div>
  <div class="ch card" id="c-dir"><b>工具目錄網站</b><span>正在比較工具的人</span><em>要：分類、價格方案、Logo 尺寸</em></div>
  <div class="ch card" id="c-store"><b>App 商店／外掛市集</b><span>已經在用那個平台的人</span><em>要：審核、隱私權政策、截圖規格</em></div>
 </div>
 <div class="tip card">選一兩個「你的客人本來就在」的地方，做好，比到處都放一點有用</div>
</div>
<script src="script.js"></script>
</body>
</html>
