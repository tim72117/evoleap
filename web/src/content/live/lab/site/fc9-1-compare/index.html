<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>資料要放哪裡</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="wrap">
  <h1>資料要放哪裡？四種常見的選擇</h1>
  <p class="muted">從最簡單到最能撐，點一張卡看看它適合誰。</p>
  <div class="opts">
    <button class="opt" id="o-file"><svg viewBox="0 0 80 80"><path d="M18 8h32l14 14v50H18z" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><path d="M50 8v14h14M28 38h26M28 48h26M28 58h18" stroke="#b45309" stroke-width="3" fill="none"/></svg>
      <b>檔案</b><span class="sub">JSON、CSV</span><ul><li>像一本筆記本</li><li>不用裝任何東西</li><li>兩個人同時寫會互相蓋掉</li></ul><p class="fit">適合：設定、少量不常改的資料</p></button>
    <button class="opt" id="o-sqlite"><svg viewBox="0 0 80 80"><rect x="12" y="20" width="56" height="48" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><path d="M12 36h56M12 52h56M34 28h12M34 44h12M34 60h12" stroke="#0369a1" stroke-width="3"/></svg>
      <b>SQLite</b><span class="sub">一個檔案的資料庫</span><ul><li>像抽屜裡的檔案櫃</li><li>能用 SQL 查詢，速度快</li><li>放在一台電腦上，難以多台共用</li></ul><p class="fit">適合：本機工具、單台主機的小網站</p></button>
    <button class="opt" id="o-pg"><svg viewBox="0 0 80 80"><rect x="16" y="10" width="48" height="62" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><path d="M26 22h8M26 34h8M26 46h8M46 22h8M46 34h8M46 46h8M34 72V60h12v12" stroke="#6d28d9" stroke-width="3" fill="none"/></svg>
      <b>Postgres</b><span class="sub">獨立的資料庫伺服器</span><ul><li>像銀行的金庫，有專人管</li><li>很多人同時讀寫也穩</li><li>要開一台資料庫服務（每月有費用）</li></ul><p class="fit">適合：有會員、訂單、金流的正式網站</p></button>
    <button class="opt" id="o-fs"><svg viewBox="0 0 80 80"><path d="M22 58h38a14 14 0 0 0 0-28 18 18 0 0 0-34-4 15 15 0 0 0-4 32z" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><path d="M30 44h22M30 50h14" stroke="#15803d" stroke-width="3"/></svg>
      <b>Firestore</b><span class="sub">雲端文件資料庫</span><ul><li>像雲端的共用筆記本</li><li>手機、網頁即時同步</li><li>複雜的統計查詢比較麻煩</li></ul><p class="fit">適合：聊天、即時協作、App</p></button>
  </div>
</div>
</body></html>
