<!doctype html><html><head><title>錯誤追蹤服務 · 開始使用</title></head><body>
<div class="bar"><span class="lg">◎</span>示意錯誤追蹤服務</div>
<div class="pg" id="pg" data-view="1">
<section class="v v1"><h1>建立免費帳號</h1><p>每月 5,000 筆錯誤以內免費</p>
<button class="sso" id="google"><span class="g">G</span>用 Google 帳號繼續</button>
<div class="or">或</div><input placeholder="Email" disabled><input placeholder="密碼" type="password" disabled></section>
<section class="v v2"><h1>建立專案</h1><p>你的網站用什麼做的？</p>
<div class="plats"><button class="plat" id="plat-browser">🌐 瀏覽器 JavaScript</button><button class="plat">⚛ React</button><button class="plat">🟢 Node.js</button></div>
<label>專案名稱<input id="pname" placeholder="例如 my-site"></label>
<button class="primary" id="create">建立專案</button></section>
<section class="v v3"><h1>✓ 專案 shop-web 建好了</h1><p>把下面這串 DSN 交給你的程式。DSN 是錯誤報告的「收件地址」，不是密碼。</p>
<div class="dsn" id="dsn">https://abc123@o42.ingest.errors.example.io/77</div>
<button class="primary" id="copy">複製 DSN</button><span class="copied" id="copied">已複製</span></section>
</div></body></html>
