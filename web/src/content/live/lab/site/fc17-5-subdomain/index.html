<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>子網域、轉址與信箱</title></head><body>
<div id="app" class="wrap">
<p class="kicker">圖解 · 一個網域，好幾個門牌</p>
<h1>xiaosen-bakery.com 這棟大樓</h1>
<div class="tabs"><button id="b0" data-go="0">子網域</button><button id="b1" data-go="1">www 轉址</button><button id="b2" data-go="2">網域信箱</button><button id="b3" data-go="3">誰能代寄</button></div>
<div data-only="0" class="tree">
<svg viewBox="0 0 1120 400" width="1120" height="400">
<rect x="410" y="20" width="300" height="70" rx="14" fill="#2563eb"/><text x="560" y="63" text-anchor="middle" font-size="24" fill="#fff" font-weight="700">xiaosen-bakery.com</text>
<path d="M560 90 V140 M160 140 H960 M160 140 V190 M427 140 V190 M694 140 V190 M960 140 V190" stroke="#94a3b8" stroke-width="3" fill="none"/>
<g><rect x="40" y="190" width="240" height="90" rx="12" fill="#fff" stroke="#c9d4e3" stroke-width="2"/><text x="160" y="230" text-anchor="middle" font-size="22" font-weight="700">www.</text><text x="160" y="260" text-anchor="middle" font-size="15" fill="#64748b">習慣打 www 的人</text></g>
<g><rect x="307" y="190" width="240" height="90" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="427" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#0d9488">shop.</text><text x="427" y="260" text-anchor="middle" font-size="15" fill="#64748b">線上預訂（另一個平台）</text></g>
<g><rect x="574" y="190" width="240" height="90" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="694" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#7c3aed">app.</text><text x="694" y="260" text-anchor="middle" font-size="15" fill="#64748b">之後的後端服務</text></g>
<g><rect x="840" y="190" width="240" height="90" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="960" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#d97706">@ 信箱</text><text x="960" y="260" text-anchor="middle" font-size="15" fill="#64748b">hello@xiaosen-bakery.com</text></g>
<text x="560" y="350" text-anchor="middle" font-size="18" fill="#334155">每個子網域可以指到不同地方，各自一筆 DNS 紀錄，不用再買</text>
</svg></div>
<div data-only="1" class="redir">
<div class="r"><span class="mono u">www.xiaosen-bakery.com</span><span class="ar">── 301 ──▶</span><span class="mono u ok">xiaosen-bakery.com</span></div>
<p class="box">兩個網址都能打開，但內容一樣。挑一個當<b>正式網址</b>，另一個用 <b>301 轉址</b>導過去：客人不會走丟，搜尋引擎也只記一個。</p>
</div>
<div data-only="2 3" class="mail">
<svg viewBox="0 0 1120 300" width="1120" height="300">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect x="20" y="90" width="230" height="110" rx="14" fill="#fff" stroke="#c9d4e3" stroke-width="2"/><text x="135" y="135" text-anchor="middle" font-size="19" font-weight="700">客人寄信</text><text x="135" y="165" text-anchor="middle" font-size="14" fill="#64748b" class="mono">to: hello@xiaosen-bakery.com</text>
<line x1="255" y1="145" x2="385" y2="145" stroke="#d97706" stroke-width="3" marker-end="url(#ah)"/><text x="320" y="130" text-anchor="middle" font-size="14" fill="#b45309">查 MX</text>
<rect x="395" y="70" width="320" height="150" rx="14" fill="#fffdf5" stroke="#e8dcb5" stroke-width="2"/><text x="555" y="105" text-anchor="middle" font-size="17" font-weight="700">電話簿</text>
<text x="555" y="140" text-anchor="middle" font-size="15" class="mono">MX 10 mx1.mail.example</text><text x="555" y="168" text-anchor="middle" font-size="15" class="mono">MX 20 mx2.mail.example</text>
<line x1="720" y1="145" x2="850" y2="145" stroke="#d97706" stroke-width="3" marker-end="url(#ah)"/>
<rect x="860" y="90" width="240" height="110" rx="14" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="980" y="135" text-anchor="middle" font-size="19" font-weight="700">信箱服務</text><text x="980" y="165" text-anchor="middle" font-size="14" fill="#64748b">收下、放進你的信箱</text>
<g data-at="3"><rect x="395" y="236" width="320" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed"/><text x="555" y="267" text-anchor="middle" font-size="14" class="mono" fill="#5b21b6">TXT "v=spf1 include:_spf.mail.example ~all"</text></g>
</svg>
<p class="box" data-only="2"><b>MX 紀錄</b>告訴全世界：寄到這個網域的信，送去哪個信箱服務。數字小的先送，大的是備援。</p>
<p class="box" id="spf" data-only="3"><b>SPF（一筆 TXT 紀錄）</b>聲明「只有這個信箱服務可以用我的網域寄信」。沒有它，你寄出的信容易被當成垃圾信。</p>
</div>
</div></body></html>
