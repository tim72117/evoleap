<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>日日花店</title></head>
<body>
<div class="ruler" id="ruler">
  <span class="seg s1">手機排法<small>窄於 600px</small></span>
  <span class="cut">600</span>
  <span class="seg s2">平板排法<small>600–999px</small></span>
  <span class="cut">1000</span>
  <span class="seg s3">電腦排法<small>1000px 以上</small></span>
</div>
<header class="top" id="top">
  <div class="brand">日日花店</div>
  <button class="menu-btn" id="menu-btn" aria-label="選單"><i></i><i></i><i></i></button>
  <nav class="nav" id="nav"><a href="#">首頁</a><a href="#">花束</a><a href="#">盆栽</a><a href="#">訂花</a><a href="#">聯絡我們</a></nav>
</header>
<div class="layout" id="layout">
  <main class="main" id="main">
    <section class="hero" id="hero">
      <div class="hero-art"><span class="bloom b1"></span><span class="bloom b2"></span><span class="bloom b3"></span></div>
      <div class="hero-text">
        <h1>把今天的心情，包成一束花</h1>
        <p>市區當日配送，下午兩點前訂購。</p>
        <a class="cta" href="#">開始訂花</a>
      </div>
    </section>
    <div class="sec-head"><h2>本週花束</h2><span class="cols" id="cols"></span></div>
    <div class="grid" id="grid">
      <div class="card"><div class="art a1"></div><div class="info"><b>粉色晨光</b><span>NT$ 880</span></div></div>
      <div class="card"><div class="art a2"></div><div class="info"><b>向日葵小束</b><span>NT$ 650</span></div></div>
      <div class="card"><div class="art a3"></div><div class="info"><b>白色桔梗</b><span>NT$ 980</span></div></div>
      <div class="card"><div class="art a4"></div><div class="info"><b>紫色薰衣草</b><span>NT$ 720</span></div></div>
      <div class="card"><div class="art a5"></div><div class="info"><b>橘色玫瑰</b><span>NT$ 1,080</span></div></div>
      <div class="card"><div class="art a6"></div><div class="info"><b>綠意乾燥花</b><span>NT$ 560</span></div></div>
    </div>
  </main>
  <aside class="aside" id="aside">
    <h3>本週推薦</h3>
    <p class="pick"><span class="dot"></span>母親節預購開始</p>
    <p class="pick"><span class="dot"></span>花束加購小卡 NT$ 30</p>
    <p class="pick"><span class="dot"></span>滿 1,500 免運費</p>
  </aside>
</div>
<footer class="foot">日日花店 · 週一到週六 10:00–19:00</footer>
</body>
</html>
