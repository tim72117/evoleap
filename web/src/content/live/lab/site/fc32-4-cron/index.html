<!doctype html><html><head><title>排程的 AI 任務</title></head><body><div class="wrap">
<h1 class="ttl">把 AI 當成每週一早上準時來上班的助理</h1>
<p class="sub">排程：時間到就自己開一次工作階段，做完寫報告</p>
<div class="cal">
 <div class="wk box" id="w1" data-go="c1"><b>11/3 週一 09:00</b><span data-at="c1">套件：2 個可更新（小版本）</span><span data-at="c1">數據：上週訂單 +12%</span></div>
 <div class="wk box" id="w2" data-go="c2"><b>11/10 週一 09:00</b><span data-at="c2">套件：1 個有安全更新 <i class="bad">要處理</i></span><span data-at="c2">數據：週三流量掉一半</span></div>
 <div class="wk box" id="w3" data-go="c3"><b>11/17 週一 09:00</b><span data-at="c3">等著你……</span></div>
</div>
<div class="fit">
 <div class="r ok box" data-at="c4"><b>適合排程</b>檢查（套件、連結、錯誤紀錄）· 整理（數據週報）· 摘要（客人留言）</div>
 <div class="r bad box" data-at="c5"><b>不適合排程</b>自動部署正式網站 · 自動回覆客人 · 自動付款或刪資料</div>
</div>
<div class="btns"><button id="g4" data-go="c4">適合</button><button id="g5" data-go="c5">不適合</button></div>
</div></body></html>
