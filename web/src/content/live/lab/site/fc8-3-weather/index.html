<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>小森烘焙｜今天適合吃什麼</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top" style="--brand:#b45309"><div class="logo"><i></i>小森烘焙</div><span class="sp"></span><span class="who">首頁</span></header>
<div class="wrap">
  <div class="hero">
    <div><h1>今天適合吃什麼？</h1><p class="muted">依今天台北的天氣，推薦一款麵包。</p></div>
    <div class="wx card" id="ok">
      <div class="sun"></div>
      <div><div class="t">28°C　晴</div><div class="muted">降雨機率 10%</div></div>
      <div class="pick">推薦：<b>冰鎮檸檬塔</b></div>
      <div class="src mono">資料來源：天氣資料平台（經由 /api/weather）</div>
    </div>
    <div class="wx card fb hide" id="fb">
      <div class="cloud"></div>
      <div><div class="t">天氣資料暫時拿不到</div><div class="muted">不影響訂購，商品照常販售。</div></div>
      <div class="pick">今日推薦：<b>招牌可頌</b></div>
    </div>
  </div>
  <div class="tools"><button class="btn ghost small" id="down">模擬：天氣服務沒回應</button><button class="btn ghost small" id="up">恢復正常</button></div>
</div>
</body></html>
