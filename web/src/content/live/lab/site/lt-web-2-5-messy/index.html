<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>晴日瑜珈</title></head>
<body>
<div class="app" id="app">
  <header class="top" id="top"><div class="brand">晴日瑜珈</div><nav class="nav"><a href="#">課表</a><a href="#">老師</a><a href="#">價目</a><a href="#">交通</a></nav></header>
  <section class="intro"><h1 class="title">本週課表</h1><p class="lead">一堂 60 分鐘，第一次上課可以免費試上。</p></section>
  <div class="cards" id="cards">
    <div class="card" id="c1">
      <div class="pic p1"></div>
      <h2 class="h-a">晨間流動</h2>
      <p class="meta">週二 07:00 · 小晴老師</p>
      <p class="desc low" id="low">適合剛起床、身體還有點僵硬的你。</p>
      <button class="b1" id="b1">預約</button>
    </div>
    <div class="card" id="c2">
      <div class="pic p2"></div>
      <h2 class="h-b">伸展放鬆</h2>
      <p class="meta">週四 19:30 · 阿樹老師</p>
      <p class="desc">下班後的一小時，把肩頸慢慢打開。</p>
      <button class="b2" id="b2">預約</button>
    </div>
    <div class="card" id="c3">
      <div class="pic p3"></div>
      <h2 class="h-c">核心力量</h2>
      <p class="meta">週六 10:00 · 小晴老師 <span class="full">名額已滿</span></p>
      <p class="desc low">練出穩定的腹部與背部力量。</p>
      <button class="b3" id="b3">候補</button>
    </div>
  </div>
  <p class="note">取消請在上課前 4 小時，<span class="warn">逾時恕不退費</span>。</p>
</div>
</body>
</html>
