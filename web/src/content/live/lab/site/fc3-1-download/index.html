<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>下載 Visual Studio Code</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-start="1">
<div class="hero">
  <div class="logo">⟨⟩</div>
  <div class="ttl">下載 Visual Studio Code</div>
  <div class="sub">免費、可在 Mac、Windows、Linux 使用（示意頁）</div>
</div>
<div class="p1">
  <div class="row dl">
    <button class="card os" id="dl-mac" data-go="2"> <b>macOS</b><br><span class="muted">通用版（Apple 晶片／Intel）</span></button>
    <button class="card os"><b>⊞ Windows</b><br><span class="muted">使用者安裝版</span></button>
    <button class="card os"><b>🐧 Linux</b><br><span class="muted">.deb / .rpm</span></button>
  </div>
</div>
<div class="p2">
  <div class="card done">
    <div class="ok">✓ 已下載 VSCode-darwin-universal.zip</div>
    <ol><li>打開「下載項目」，點兩下解壓縮</li><li>把 <b>Visual Studio Code</b> 拖進「應用程式」</li><li>第一次打開時選「打開」</li></ol>
  </div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
