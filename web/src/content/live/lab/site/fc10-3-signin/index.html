<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>小森烘焙｜登入</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top" style="--brand:#b45309"><div class="logo"><i></i>小森烘焙</div><span class="sp"></span><span class="who" id="who">訪客</span></header>
<div class="wrap">
  <div class="box card" id="box">
    <h1>登入小森烘焙</h1>
    <p class="muted">登入後可以看訂單紀錄、累積點數。</p>
    <button class="gbtn" id="google"><span class="g">G</span>使用 Google 帳號登入</button>
    <div class="or">或</div>
    <button class="btn ghost" style="width:100%;justify-content:center">用 Email 登入</button>
  </div>
  <div class="box card hide" id="pick">
    <p class="muted">選擇帳號以繼續使用「小森烘焙」</p>
    <button class="acc" id="acc"><span class="av">安</span><span><b>小安</b><br><span class="muted">an@example.com</span></span></button>
    <p class="tiny muted">密碼與兩步驟驗證都在 Google 的頁面上完成，網站拿不到你的密碼。</p>
  </div>
  <div class="box card hide" id="in">
    <div class="okc">✓</div>
    <h1>嗨，小安</h1>
    <p class="muted">已用 Google 帳號登入（an@example.com）</p>
    <p class="mono tiny">後端已驗證 ID Token：簽名、aud、exp 都正確</p>
  </div>
</div>
</body></html>
