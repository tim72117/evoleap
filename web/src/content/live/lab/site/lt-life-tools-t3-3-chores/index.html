<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>你的那一件瑣事</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div class="tabs"><button class="tab" data-go="1">別人的瑣事</button><button class="tab" data-go="2">你的那一件</button><button class="tab" data-go="3">適不適合</button><button class="tab" data-go="4">太大就縮小</button></div>
  <div class="cards">
    <div class="cd r1"><b>每月對帳</b><span>把銀行明細和收據對一遍</span></div>
    <div class="cd r1"><b>排值日表</b><span>每週輪一次，誰都不想多排</span></div>
    <div class="cd r1"><b>整理會議紀錄</b><span>把重點和待辦挑出來</span></div>
    <div class="cd r1 drink"><b>團購飲料</b><span>抄訊息、合併杯數、算錢</span></div>
    <div class="cd blank r2"><b>？</b><span>你的那一件是什麼？</span></div>
  </div>
  <div class="sentence r2">我每【多久】要【做什麼】，每次都要【花時間在哪】</div>
  <div class="checks r3">
    <div class="ck">✓ 常常重複</div><div class="ck">✓ 每次步驟差不多</div><div class="ck">✓ 輸入是可以貼上的文字或數字</div><div class="ck">✓ 結果自己看得懂、驗得了</div>
  </div>
  <div class="shrink r4">
    <div class="big">大家一起填的報名表<small>要伺服器、登入、多人共用資料</small></div>
    <div class="to">縮小成 ⟶</div>
    <div class="small">自己貼上報名名單，<br>自己看統計<small>只用瀏覽器就做得到</small></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
