<!doctype html><html><head><title>CI 是什麼</title></head><body>
<div class="app s0">
  <div class="flow">
    <div class="node" id="nPc"><svg viewBox="0 0 80 60"><rect x="8" y="6" width="64" height="40" rx="4" class="scr"/><rect x="2" y="48" width="76" height="6" rx="3" class="base"/></svg><b>你的電腦</b><small>改好程式</small></div>
    <div class="link l1"><span>git push</span></div>
    <div class="node" id="nHub"><svg viewBox="0 0 80 60"><path d="M20 46a14 14 0 0 1 2-28 18 18 0 0 1 34 4 12 12 0 0 1 4 24z" class="cloud"/></svg><b>GitHub</b><small>放程式碼的地方</small></div>
    <div class="link l2"><span>自動通知</span></div>
    <div class="node bot" id="nBot"><svg viewBox="0 0 80 60"><rect x="18" y="14" width="44" height="34" rx="9" class="bb"/><circle cx="32" cy="30" r="5" class="ey"/><circle cx="48" cy="30" r="5" class="ey"/><path d="M40 14V6" class="an"/></svg><b>CI 機器人</b><small>一台全新的電腦</small>
      <ol class="jobs"><li id="j1">下載程式碼</li><li id="j2">安裝套件</li><li id="j3">跑全部測試</li></ol></div>
  </div>
  <div class="commits" id="commits">
    <div class="ch">提交紀錄（main）</div>
    <div class="c c1"><span class="m pend">●</span>加入會員九折<small>剛剛 · 你</small><em class="stat"></em></div>
    <div class="c c2"><span class="m">✓</span>修正運費計算<small>昨天 · 你</small><em class="okt">通過</em></div>
    <div class="merge" id="merge"><b>合併請求：加入全館八折</b><span class="chk"></span><button class="mb" id="mb">合併</button></div>
  </div>
  <div class="chips">
    <button id="b1" data-s="1">① push</button>
    <button id="b2" data-s="2">② 機器人開工</button>
    <button id="b3" data-s="3">③ 通過 ✓</button>
    <button id="b4" data-s="4">④ 失敗 ✗</button>
  </div>
</div>
</body></html>
