<!doctype html><html><head><title>資料庫 · 備份與還原</title></head><body>
<div class="bar"><span class="lg"></span>示意雲端主控台<span class="crumb">/ 資料庫 shop-db / 備份</span></div>
<div class="pg">
<h1>還原到哪個時間點？</h1>
<div class="tl" id="tl">
<div class="axis"></div>
<div class="lbl" style="left:2%">11/08 00:00</div><div class="lbl" style="left:46%">11/08 12:00</div><div class="lbl" style="left:88%">11/09 00:00</div>

<div class="boom" id="boom" style="left:61%"><b>💥 14:32</b><span>商品表被刪除</span></div>
<button class="dot alt" id="b-pitr" style="left:60.2%"><span>14:31</span></button>

</div>
