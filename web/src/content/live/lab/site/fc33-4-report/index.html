<!doctype html><html><head><title>這次工作的用量</title></head><body>
<div class="wrap">
  <h1 class="ttl">同一個任務，兩種交代方式</h1>
  <p class="sub">任務：修好手機寬度的換行問題（長條是示意比例）</p>
  <div class="cmp">
    <div class="side a"><div class="hd">第一次：「網站怪怪的，幫我看看」</div>
      <div class="row"><span>讀檔案</span><i style="width:80%"></i><b>24 個檔</b></div>
      <div class="row"><span>找檔案</span><i style="width:45%"></i><b>38 個</b></div>
      <div class="row"><span>來回對話</span><i style="width:55%"></i><b>3 輪</b></div>
      <div class="tot">總用量 <b>100%</b></div>
    </div>
    <div class="side b" data-at="after" id="after"><div class="hd">第二次：指出檔案與完成條件</div>
      <div class="row"><span>讀檔案</span><i style="width:8%"></i><b>1 個檔</b></div>
      <div class="row"><span>找檔案</span><i style="width:2%"></i><b>0 個</b></div>
      <div class="row"><span>來回對話</span><i style="width:10%"></i><b>1 輪</b></div>
      <div class="tot">總用量 <b>約 20%</b></div>
    </div>
  </div>
  <div class="tips" data-at="after">指出檔案 · 只貼關鍵的錯誤 · 一件事做完開新對話 · 一次講清楚完成條件</div>
  <button class="more" id="afterBtn" data-go="after">第二次</button>
</div>
</body></html>
