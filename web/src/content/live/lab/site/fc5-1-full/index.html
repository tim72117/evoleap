<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>林小安</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="page">
  <header class="hero">
    <div class="avatar" role="img" aria-label="林小安的大頭貼">安</div>
    <h1 data-i18n="name">林小安</h1>
    <p class="tagline" data-i18n="tagline">喜歡烘焙的設計新手</p>
    <nav class="nav"><a href="#about">關於我</a><a href="#likes">興趣</a><a href="#hello">打招呼</a></nav>
  </header>
  <section id="about" class="block">
    <h2 data-i18n="aboutT">關於我</h2>
    <p data-i18n="about">我在台中長大，白天做行政工作，晚上學做網站。最喜歡週末烤一盤司康，分給同事吃。</p>
  </section>
  <section id="likes" class="block">
    <h2 data-i18n="likesT">我的興趣</h2>
    <div class="cards">
      <div class="card"><b data-i18n="l1">烘焙</b><span data-i18n="l1d">司康、磅蛋糕</span></div>
      <div class="card"><b data-i18n="l2">散步</b><span data-i18n="l2d">每天傍晚走 30 分鐘</span></div>
      <div class="card"><b data-i18n="l3">做網站</b><span data-i18n="l3d">正在學 HTML 和 CSS</span></div>
    </div>
  </section>
  <section id="hello" class="hello">
    <button id="hi" class="btn" type="button" data-i18n="hi">打個招呼</button>
    <p id="msg" class="msg" data-i18n="msg0">按一下按鈕，跟我說嗨</p>
  </section>
  <footer class="foot" data-i18n="foot">© 2026 林小安</footer>
</div>
</body>
</html>
