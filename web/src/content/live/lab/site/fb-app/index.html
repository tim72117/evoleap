<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>開發者網站：建立 App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><b>開發者網站</b><span>我的 App</span></header>
  <main>
    <h1>建立 App</h1>
    <p class="hint">App 是你的程式在 Facebook 的身分。之後程式發文，都是用這個 App 的名義申請權限。</p>
    <label>App 名稱<input id="name" type="text" placeholder="例如：網站發文小幫手"></label>
    <label>用途
      <select id="use">
        <option value="">請選擇</option>
        <option value="pages">管理粉絲專頁</option>
        <option value="login">讓使用者用 Facebook 登入</option>
      </select>
    </label>
    <button id="create">建立 App</button>
  </main>
</body>
</html>
