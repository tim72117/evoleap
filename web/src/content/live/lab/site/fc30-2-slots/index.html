<!doctype html><html><head><title>小森烘焙｜訂購</title></head><body>
<header class="top"><b>小森烘焙</b><span>線上訂購</span></header>
<main class="wrap">
  <h1 class="ttl">訂購表單</h1>
  <form id="order" class="box form">
    <label>品項<select id="item"><option>伯爵茶蛋糕</option><option>原味司康 × 6</option></select></label>
    <label>取貨日<input id="day" value="11/14（六）"></label>
    <label id="slotBox" class="new">取貨時段
      <select id="slot"><option value="">請選擇</option><option value="am">上午 9:00–12:00</option><option value="pm">下午 13:00–18:00</option></select>
    </label>
    <button type="submit" id="send">送出訂單</button>
    <p id="done" class="done"></p>
  </form>
</main>
</body></html>
