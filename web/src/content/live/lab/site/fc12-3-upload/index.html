<!doctype html><html><head><title>上傳的路線</title></head><body>
<div class="app">
  <div class="cols">
    <div class="col">
      <h3>① 你選的檔案</h3>
      <div class="files" id="files">
        <button class="file" id="f1" data-ok="1"><span class="ic jpg"></span>貓咪.jpg<small>2.1 MB</small></button>
        <button class="file" id="f2" data-ok="0" data-why="太大了（上限 10 MB）"><span class="ic png"></span>婚禮.png<small>18 MB</small></button>
        <button class="file" id="f3" data-ok="0" data-why="不是圖片格式"><span class="ic exe"></span>報價單.exe<small>0.4 MB</small></button>
        <button class="file" id="f4" data-ok="1"><span class="ic webp"></span>甜點.webp<small>0.9 MB</small></button>
      </div>
    </div>
    <div class="col gate" id="gate">
      <h3>② 上傳前檢查</h3>
      <svg viewBox="0 0 120 120"><rect x="20" y="20" width="16" height="90" rx="4"/><rect x="84" y="20" width="16" height="90" rx="4"/><rect x="30" y="40" width="60" height="10" rx="5" class="bar"/></svg>
      <ul><li>大小 ≤ 10 MB</li><li>只收 jpg、png、webp</li></ul>
      <div class="rej" id="rej"><b>退回</b></div>
    </div>
    <div class="col store" id="store">
      <h3>③ 雲端儲存</h3>
      <svg viewBox="0 0 160 120" class="bucket"><ellipse cx="80" cy="22" rx="62" ry="14" class="top"/><path d="M18 22v72c0 8 28 14 62 14s62-6 62-14V22" class="side"/><ellipse cx="80" cy="22" rx="62" ry="14" class="rim"/></svg>
      <div class="saved" id="saved"></div>
      <p class="addr">每個檔案有自己的網址<br><code>files.example/u/42/貓咪.jpg</code></p>
    </div>
    <div class="col thumbs" id="thumbs">
      <h3>④ 縮圖</h3>
      <div class="tgrid" id="tgrid"></div>
      <button class="make" id="make">產生縮圖</button>
      <div class="cmp" id="cmp">
        <div><span class="b big"></span>原圖 2.1 MB</div>
        <div><span class="b small"></span>縮圖 30 KB</div>
      </div>
    </div>
  </div>
  <div class="msg" id="msg">點一個檔案，看它會走到哪裡。</div>
</div>
</body></html>
