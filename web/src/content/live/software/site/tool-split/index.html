<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聚餐分帳小幫手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <span class="logo">🍲</span>
      <div>
        <h1>聚餐分帳小幫手</h1>
        <p>輸入每個人先付了多少，馬上算出誰要給誰。</p>
      </div>
    </header>
    <section class="people">
      <label><span class="avatar a1">美</span>小美<input id="a" inputmode="numeric" placeholder="0"><em>元</em></label>
      <label><span class="avatar a2">哲</span>阿哲<input id="b" inputmode="numeric" placeholder="0"><em>元</em></label>
      <label><span class="avatar a3">慧</span>佳慧<input id="c" inputmode="numeric" placeholder="0"><em>元</em></label>
      <label><span class="avatar a4">芸</span>小芸<input id="d" inputmode="numeric" placeholder="0"><em>元</em></label>
    </section>
    <section class="total">
      <div><small>總共</small><strong id="sum">0</strong></div>
      <div><small>每人</small><strong id="each">0</strong></div>
    </section>
    <section class="result" id="result">
      <p class="empty">填上金額就會算出來</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
