<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>封面裁切工具</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --border: #e4ddd0;
    --ink: #2b2620;
    --ink-soft: #6b6153;
    --accent: #b5742a;
    --accent-soft: #f3e6d4;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Inter", -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1915;
      --surface: #262219;
      --border: #3a3326;
      --ink: #efe9dd;
      --ink-soft: #a89c87;
      --accent: #e0a85c;
      --accent-soft: #3a2e1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1915;
    --surface: #262219;
    --border: #3a3326;
    --ink: #efe9dd;
    --ink-soft: #a89c87;
    --accent: #e0a85c;
    --accent-soft: #3a2e1c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 64px;
    line-height: 1.6;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; text-wrap: balance; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    background: var(--surface);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 24px;
  }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone p { margin: 4px 0; color: var(--ink-soft); font-size: 14px; }
  .dropzone strong { color: var(--ink); }
  .dropzone input { display: none; }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .target-btn {
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
  }
  .target-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .editor {
    display: none;
  }
  .editor.ready { display: block; }

  .stage-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    overflow: auto;
  }
  .stage {
    position: relative;
    margin: 0 auto;
    overflow: hidden;
    background: repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
    touch-action: none;
    cursor: grab;
  }
  .stage.dragging { cursor: grabbing; }
  .stage img {
    position: absolute;
    left: 0; top: 0;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .crop-frame {
    position: absolute;
    inset: 0;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events: none;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .controls label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="range"] { width: 160px; accent-color: var(--accent); }

  .export-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  button.primary {
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.primary:hover { opacity: 0.88; }
  button.primary:active { opacity: 0.7; }
  .result-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }

  .result-box {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .result-box img {
    display: block;
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .result-hint {
    margin: 10px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .spec-box {
    margin-top: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .spec-box div strong { color: var(--ink); display: block; font-size: 13px; margin-bottom: 2px; }

  footer {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    input[type="range"] { width: 120px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Hahow 封面素材工具</div>
    <h1>封面裁切工具</h1>
    <p class="sub">上傳 showcase 截圖或任何素材，拖曳與縮放對齊裁切框，輸出 Hahow 要求的正確比例與解析度。</p>
  </header>

  <div class="dropzone" id="dropzone">
    <p><strong>點擊選擇圖片</strong> 或把檔案拖曳到這裡</p>
    <p>支援 jpg / png，建議使用解析度較高的原圖</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="editor" id="editor">
    <div class="toolbar">
      <button class="target-btn active" data-w="1000" data-h="620">長形封面 1000 × 620</button>
      <button class="target-btn" data-w="800" data-h="800">方形封面 800 × 800</button>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img id="stageImg" alt="">
        <div class="crop-frame"></div>
      </div>
    </div>

    <div class="controls">
      <label>縮放
        <input type="range" id="zoom" min="100" max="400" value="100" step="1">
      </label>
      <span class="result-meta" id="zoomVal">100%</span>
    </div>

    <div class="export-row">
      <button class="primary" id="downloadBtn">產生裁切結果</button>
      <span class="result-meta" id="exportMeta"></span>
    </div>

    <div class="result-box" id="resultBox" hidden>
      <img id="resultImg" alt="裁切結果預覽">
      <p class="result-hint">長按（手機）或右鍵（電腦）圖片選擇「另存圖片」即可下載。</p>
    </div>
  </div>

  <div class="spec-box">
    <div><strong>長形封面</strong>比例 1000:620，寬度 &gt; 1000px</div>
    <div><strong>方形封面</strong>比例 1:1，尺寸 800×800px</div>
    <div><strong>提醒</strong>避免把重點文字/人物放在畫面四角，容易被介面元素遮擋</div>
  </div>

  <footer>course/materials/cover-cropper.html · 所有處理都在瀏覽器本機完成，圖片不會上傳</footer>
</div>

<script>
(() => {
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  const editor = document.getElementById("editor");
  const stage = document.getElementById("stage");
  const stageImg = document.getElementById("stageImg");
  const zoomSlider = document.getElementById("zoom");
  const zoomVal = document.getElementById("zoomVal");
  const downloadBtn = document.getElementById("downloadBtn");
  const exportMeta = document.getElementById("exportMeta");
  const resultBox = document.getElementById("resultBox");
  const resultImg = document.getElementById("resultImg");
  const targetBtns = document.querySelectorAll(".target-btn");

  let target = { w: 1000, h: 620 };
  let img = new Image();
  let naturalW = 0, naturalH = 0;
  let baseScale = 1;
  let scale = 1;
  let offsetX = 0, offsetY = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, startOffX = 0, startOffY = 0;

  const STAGE_MAX_W = 760;

  function stageDims() {
    const ratio = target.h / target.w;
    const w = Math.min(STAGE_MAX_W, 760);
    const h = Math.round(w * ratio);
    return { w, h };
  }

  function layoutStage() {
    const { w, h } = stageDims();
    stage.style.width = w + "px";
    stage.style.height = h + "px";
    if (naturalW) {
      baseScale = Math.max(w / naturalW, h / naturalH);
      clampAndApply(true);
    }
  }

  function clampAndApply(reset) {
    const { w, h } = stageDims();
    const effScale = baseScale * scale;
    const dispW = naturalW * effScale;
    const dispH = naturalH * effScale;
    if (reset) {
      offsetX = (w - dispW) / 2;
      offsetY = (h - dispH) / 2;
    }
    const minX = w - dispW, maxX = 0;
    const minY = h - dispH, maxY = 0;
    offsetX = Math.min(maxX, Math.max(minX, offsetX));
    offsetY = Math.min(maxY, Math.max(minY, offsetY));
    stageImg.style.width = dispW + "px";
    stageImg.style.height = dispH + "px";
    stageImg.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const url = URL.createObjectURL(file);
    img = new Image();
    img.onload = () => {
      naturalW = img.naturalWidth;
      naturalH = img.naturalHeight;
      stageImg.src = url;
      editor.classList.add("ready");
      zoomSlider.value = 100;
      scale = 1;
      layoutStage();
    };
    img.src = url;
  }

  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => loadFile(e.target.files[0]));
  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    loadFile(file);
  });

  targetBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      targetBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      target = { w: Number(btn.dataset.w), h: Number(btn.dataset.h) };
      layoutStage();
    });
  });

  zoomSlider.addEventListener("input", () => {
    scale = Number(zoomSlider.value) / 100;
    zoomVal.textContent = zoomSlider.value + "%";
    clampAndApply(false);
  });

  function pointerDown(x, y) {
    dragging = true;
    stage.classList.add("dragging");
    dragStartX = x; dragStartY = y;
    startOffX = offsetX; startOffY = offsetY;
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    offsetX = startOffX + (x - dragStartX);
    offsetY = startOffY + (y - dragStartY);
    clampAndApply(false);
  }
  function pointerUp() {
    dragging = false;
    stage.classList.remove("dragging");
  }

  stage.addEventListener("mousedown", (e) => pointerDown(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", pointerUp);

  stage.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  stage.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  stage.addEventListener("touchend", pointerUp);

  window.addEventListener("resize", () => { if (naturalW) layoutStage(); });

  downloadBtn.addEventListener("click", () => {
    if (!naturalW) return;
    const { w: stageW, h: stageH } = stageDims();
    const outW = target.w;
    const outH = target.h;
    const exportScale = outW / stageW;

    const canvas = document.createElement("canvas");
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext("2d");

    const effScale = baseScale * scale;
    const srcX = -offsetX / effScale;
    const srcY = -offsetY / effScale;
    const srcW = stageW / effScale;
    const srcH = stageH / effScale;

    ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);

    const dataUrl = canvas.toDataURL("image/png");
    resultImg.src = dataUrl;
    resultBox.hidden = false;
    exportMeta.textContent = `已產生 ${outW}×${outH}px`;
    resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
})();
</script>
</body>
</html>
