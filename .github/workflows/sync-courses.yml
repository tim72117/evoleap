name: Sync course data

# 只把新的課程資料補進正式資料庫,不部署網站、不用打 tag:courses_seed.json 新加了課程、單元、課,或有新的腳本檔時,
# 在 GitHub Actions 選 dev 分支按「Run workflow」(或 gh workflow run sync-courses.yml --ref dev)。
# 只能從 dev 分支執行,選其他分支會直接失敗(免得開發中的分支把課程或資料表結構寫進正式資料庫)。
# 只跑和課程資料有關的測試(Go 測試、課程一致性測試),build 課程同步工作的小 image(Dockerfile 的 course-sync 目標,
# 只有 cmd/sync 與腳本目錄,不建置前端),再執行課程同步工作(Cloud Run Job)。
# 現階段課程資料以種子為準:同步會把資料庫裡已經有的課(開放狀態、時間、腳本內容)也更新成種子的內容,要改請改種子;
# 等課程架構穩定、改成以資料庫為準後,才用 evoleap CLI 改。
# 新增課程頁(前端路由、SEO、課程內容)和程式的修改,還是要打 tag 部署網站(deploy-cloudrun.yml)。
on:
  workflow_dispatch:

# 和部署共用一個執行序:不會和部署或另一次同步同時寫資料庫
concurrency:
  group: course-data
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: "shuttle-045094509"
  CLOUD_RUN_REGION: "asia-east1"
  CLOUD_RUN_SYNC_JOB: "shuttle-course-sync"
  SYNC_IMAGE: "asia-east1-docker.pkg.dev/shuttle-045094509/cloud-run-source-deploy/shuttle-course-sync"
  CLOUDSQL_INSTANCE: "onagent-prod:asia-east1:onagent-db"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # 只能從 dev 分支執行:其他分支直接失敗(不用 if 跳過,免得看起來像成功)
      - name: Only the dev branch can sync course data
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ]; then
            echo "::error::課程同步只能從 dev 分支執行(這次是 ${{ github.ref_name }})"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # 和課程資料有關的測試:寫入與把關(Go)、種子和腳本檔一致(前端的課程一致性測試)
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go tests
        working-directory: server
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Course data tests
        working-directory: web
        run: |
          npm ci
          npx vitest run src/content/courseMap.test.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push the course sync image
        run: |
          docker build --target course-sync -t ${{ env.SYNC_IMAGE }}:${{ github.sha }} .
          docker push ${{ env.SYNC_IMAGE }}:${{ github.sha }}

      - name: Sync course data (Cloud Run Job)
        run: .github/scripts/run-course-sync.sh ${{ env.SYNC_IMAGE }}:${{ github.sha }}
