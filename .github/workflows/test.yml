name: Test

# 每次 push 與 PR 都跑完整測試,確保修改(包含 AI 產生的修改)沒有改壞既有功能:
#   Go 單元測試 → 前端型別檢查 → vitest 單元測試 → 正式 build(含 SEO 產生)→ Playwright E2E
on:
  push:
    branches: ['**']
  pull_request:
  # 部署流程(deploy-cloudrun.yml)先呼叫這份測試,全部通過才部署。
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go vet & test
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build (includes SEO pages, sitemap, robots)
        working-directory: web
        run: npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E tests (production build served by Go)
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
